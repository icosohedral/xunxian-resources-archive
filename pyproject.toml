[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xunxian-resources-archive"
version = "0.1.0"
description = "可追溯的寻仙道具、宠物、骑宠与称号资料构建工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.25,<5",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xunxian_archive"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["xunxian_archive"]
